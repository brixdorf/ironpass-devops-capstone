# Lab 1: ImagePullBackOff. This Deployment never starts.
# Apply it, then find out why with kubectl get pods and kubectl describe pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ironpass-broken-image
  namespace: ironpass
  labels:
    lab: broken-image
spec:
  replicas: 1
  selector:
    matchLabels:
      lab: broken-image
  template:
    metadata:
      labels:
        lab: broken-image
    spec:
      containers:
        - name: web
          # this tag does not exist in the registry, the working tag is 1.30.6-alpine3.24
          image: nginxinc/nginx-unprivileged:9.9.9-does-not-exist
          ports:
            - containerPort: 8080
