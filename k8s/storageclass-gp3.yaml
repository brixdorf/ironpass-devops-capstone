# The EBS CSI driver provisions this class. The chart uses it for the postgres volume.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ironpass-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
