# A real PostgreSQL pod for the smoke test on a throwaway kind cluster.
# The data lives in an emptyDir, so it is gone when the pod is gone.
# For real clusters use the Helm chart in helm/ironpass, it has a PVC.
#
# The secret is created by the pipeline with a random password:
#   kubectl create secret generic ironpass-db -n ironpass --from-literal=POSTGRES_PASSWORD=...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ironpass
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:18.6-alpine3.24
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ironpass
            - name: POSTGRES_USER
              value: ironpass
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ironpass-db
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U ironpass -d ironpass"]
            initialDelaySeconds: 5
            periodSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ironpass
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
