# Values for the ingress-nginx Helm chart on EKS.
controller:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  service:
    type: LoadBalancer
    annotations:
      # tags on the AWS load balancer so the teardown script can find it
      service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "Project=ironpass,ManagedBy=helm"
