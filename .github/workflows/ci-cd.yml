name: IronPass CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Every action below is pinned to a full commit SHA. The version is in the comment.
# A tag can be moved after the fact, a commit SHA cannot.

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

concurrency:
  group: ironpass-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. tests and the frontend build. A failure here stops everything.
  test:
    name: Test and build frontend
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Run pytest
        run: pytest -v
        working-directory: backend

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Lint the Helm chart and check the Ingress wiring
        run: |
          helm lint helm/ironpass -f helm/ironpass/values-prod.yaml --set backend.tag=ci --set frontend.tag=ci
          helm template ironpass helm/ironpass -f helm/ironpass/values-prod.yaml --set backend.tag=ci --set frontend.tag=ci | python3 scripts/check-helm-wiring.py

  # 2. build each image ONCE, scan that image, then push that same image
  build-scan-push:
    name: Build, scan and push ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - backend
          - frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out the image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/ironpass-${{ matrix.image }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image (one build, loaded into the local Docker)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.image }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Fails the job on any fixable HIGH or CRITICAL finding (exit code 1).
      # v0.35.0 is the release the March 2026 advisory (CVE-2026-33634) lists as safe.
      # The Trivy program itself is set to the newest release.
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          version: v0.76.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # keep the scanned image for the smoke test, so the test uses the exact same bits
      - name: Save the scanned image
        run: docker save "$IMAGE" --output "${{ matrix.image }}-image.tar"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}
          path: ${{ matrix.image }}-image.tar
          retention-days: 1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # pushes the image that was just built and scanned, tagged with the commit SHA
      - name: Push the image
        if: github.event_name == 'push'
        run: docker push "$IMAGE"

  # 3a. smoke test on a temporary kind cluster, using the plain manifests in k8s/
  smoke-test:
    name: Smoke test on kind
    needs: build-scan-push
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true

      - name: Load the scanned images
        run: |
          docker load --input backend-image.tar
          docker load --input frontend-image.tar
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          docker tag "${REGISTRY}/${OWNER}/ironpass-backend:${{ github.sha }}" ironpass-backend:ci
          docker tag "${REGISTRY}/${OWNER}/ironpass-frontend:${{ github.sha }}" ironpass-frontend:ci

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: ironpass-ci
          version: v0.33.0

      - name: Copy the images into kind
        run: kind load docker-image ironpass-backend:ci ironpass-frontend:ci --name ironpass-ci

      - name: Deploy and call the app
        run: ./scripts/smoke-test.sh

  # 3b. Helm deploy to EKS, signed in with GitHub OIDC (no AWS keys stored)
  deploy:
    name: Deploy to EKS
    needs: smoke-test
    # set the repository variable DEPLOY_ENABLED to true while the cluster exists
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Deploy with Helm
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          helm upgrade --install ironpass helm/ironpass \
            --namespace ironpass \
            -f helm/ironpass/values-prod.yaml \
            --set backend.image="${REGISTRY}/${OWNER}/ironpass-backend" \
            --set backend.tag="${{ github.sha }}" \
            --set frontend.image="${REGISTRY}/${OWNER}/ironpass-frontend" \
            --set frontend.tag="${{ github.sha }}" \
            --wait --timeout 5m

      - name: Show the result
        run: |
          kubectl get pods -n ironpass
          kubectl get ingress -n ironpass
          helm history ironpass -n ironpass
