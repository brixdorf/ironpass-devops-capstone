# Settings used for the EKS cluster.
# The pipeline adds backend.tag and frontend.tag (the commit SHA) with --set.
backend:
  replicas: 2

frontend:
  replicas: 2

postgres:
  storage:
    size: 5Gi
    className: ironpass-gp3

ingress:
  className: traefik

hpa:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 50
