apiVersion: v1
kind: Service
metadata:
  name: {{ include "ironpass.backend.name" . }}
  labels:
    {{- include "ironpass.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "ironpass.selector" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.servicePort }}
      targetPort: http
