{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ironpass.backend.name" . }}
  labels:
    {{- include "ironpass.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ironpass.selector" . | nindent 6 }}
      app.kubernetes.io/component: backend
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
