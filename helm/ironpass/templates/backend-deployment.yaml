apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ironpass.backend.name" . }}
  labels:
    {{- include "ironpass.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ironpass.selector" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "ironpass.selector" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
        # wait until the database accepts connections before running migrations
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "ironpass.postgres.name" . }} -p {{ .Values.postgres.port }}; do echo waiting for postgres; sleep 2; done
          securityContext:
            # the postgres image has a passwd entry for uid 70, pg_isready needs one
            runAsUser: 70
            allowPrivilegeEscalation: false
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ required "set backend.tag to the image tag (the commit SHA)" .Values.backend.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ironpass.dbSecret" . }}
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
