apiVersion: v1
kind: Service
metadata:
  name: {{ include "ironpass.frontend.name" . }}
  labels:
    {{- include "ironpass.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "ironpass.selector" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.servicePort }}
      targetPort: http
