# Small settings for a laptop or a throwaway cluster (kind or Minikube).
# Build the images yourself and load them into the cluster first:
#   docker build -t ironpass-backend:dev backend
#   docker build -t ironpass-frontend:dev frontend
#   kind load docker-image ironpass-backend:dev ironpass-frontend:dev
backend:
  image: ironpass-backend
  tag: dev
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 192Mi

frontend:
  image: ironpass-frontend
  tag: dev
  replicas: 2

postgres:
  storage:
    size: 1Gi

ingress:
  className: traefik
  host: ironpass.local

hpa:
  maxReplicas: 3

# kind and Minikube have no Prometheus Operator, so there is no ServiceMonitor CRD
serviceMonitor:
  enabled: false

grafanaDashboard:
  enabled: false
